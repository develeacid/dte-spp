name: CI

on:
  push:
    branches: [desarrollo, main]
  pull_request:
    branches: [desarrollo, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: password
      # BD pública (Transparencia): Postgres separado en la misma instancia.
      DB_PUBLIC_DATABASE: testing_spp_public
      DB_PUBLIC_PORTAL_USER: spp_portal
      DB_PUBLIC_PORTAL_PASSWORD: portal_secret_ci
      # CI no levanta Redis: cache/queue/session en memoria.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      # GitHub Actions forzara Node 24 desde 2026-06-02; opt-in early para
      # silenciar warnings de actions/cache@v4, actions/checkout@v4 y
      # actions/setup-node@v4 (Node 20 deprecated).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, mbstring, xml, bcmath, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Pint (code style)
        run: vendor/bin/pint --test

      - name: Composer audit (security)
        run: composer audit

      # La BD pública debe existir (aunque sea vacía) antes de migrate, porque
      # 2026_05_14_120000_fix_datasets_catalogo_titles llama Schema::connection('pgsql_public')
      # ->hasTable() — defensivo si la tabla pub_* no existe, pero revienta si la
      # BD entera no existe. La provisión real del rol + migrations/public sigue
      # despues de migrate (provision-public-db loguea a activity_log).
      - name: Create public DB (empty, for migrate safety)
        run: PGPASSWORD=password psql -h 127.0.0.1 -U testing -d testing -c "CREATE DATABASE testing_spp_public" || true

      - name: Run migrations
        run: php artisan migrate --force

      - name: Provision public DB role + run public migrations
        run: |
          php artisan transparencia:provision-public-db
          php artisan migrate --path=database/migrations/public --database=pgsql_public --force

      - name: Run tests
        run: php artisan test
